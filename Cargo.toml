[workspace]
resolver = "3"
members = [
    "roast-core",
    "roast-ed25519",
    "roast-ed448",
    "roast-p256",
    "roast-ristretto255",
    "roast-secp256k1",
    "roast-secp256k1-evm",
    "roast-secp256k1-tr",
]

[workspace.package]
version = "0.2.0"
authors = ["StackOverflowExcept1on"]
edition = "2024"
rust-version = "1.85"
readme = "README.md"
repository = "https://github.com/StackOverflowExcept1on/roast"
license = "MIT"
categories = ["cryptography", "cryptography::cryptocurrencies", "no-std"]

[workspace.dependencies]
aes = { version = "0.8", features = ["zeroize"], default-features = false }
ctr = { version = "0.9", features = ["zeroize"], default-features = false }
digest = { version = "0.10", default-features = false }
document-features = "0.2"
frost-core = { version = "3.0", git = "https://github.com/StackOverflowExcept1on/frost", branch = "frost-secp256k1-evm-no-std-codec", features = ["internals"], default-features = false }
frost-ed25519 = { version = "3.0", git = "https://github.com/StackOverflowExcept1on/frost", branch = "frost-secp256k1-evm-no-std-codec", default-features = false }
frost-ed448 = { version = "3.0", git = "https://github.com/StackOverflowExcept1on/frost", branch = "frost-secp256k1-evm-no-std-codec", default-features = false }
frost-p256 = { version = "3.0", git = "https://github.com/StackOverflowExcept1on/frost", branch = "frost-secp256k1-evm-no-std-codec", default-features = false }
frost-ristretto255 = { version = "3.0", git = "https://github.com/StackOverflowExcept1on/frost", branch = "frost-secp256k1-evm-no-std-codec", default-features = false }
frost-secp256k1 = { version = "3.0", git = "https://github.com/StackOverflowExcept1on/frost", branch = "frost-secp256k1-evm-no-std-codec", default-features = false }
frost-secp256k1-evm = { version = "3.0", git = "https://github.com/StackOverflowExcept1on/frost", branch = "frost-secp256k1-evm-no-std-codec", default-features = false }
frost-secp256k1-tr = { version = "3.0", git = "https://github.com/StackOverflowExcept1on/frost", branch = "frost-secp256k1-evm-no-std-codec", default-features = false }
hkdf = { version = "0.12", default-features = false }
rand = { version = "0.8", default-features = false }
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
thiserror = { version = "2.0", default-features = false }
parity-scale-codec = { version = "3.7.5", default-features = false }
scale-info = { version = "2.11", features = ["derive"], default-features = false }

roast-core = { path = "roast-core", default-features = false }
roast-ed25519 = { path = "roast-ed25519", default-features = false }
roast-ed448 = { path = "roast-ed448", default-features = false }
roast-p256 = { path = "roast-p256", default-features = false }
roast-ristretto255 = { path = "roast-ristretto255", default-features = false }
roast-secp256k1 = { path = "roast-secp256k1", default-features = false }
roast-secp256k1-evm = { path = "roast-secp256k1-evm", default-features = false }
roast-secp256k1-tr = { path = "roast-secp256k1-tr", default-features = false }
